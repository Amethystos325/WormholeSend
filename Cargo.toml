[workspace]
resolver = "3"
members = ["core", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# Pinned to a known commit: the crate is not published and its API may change upstream.
localsend = { git = "https://github.com/localsend/localsend", rev = "14f3a87426eedffaa9d87d011132eca5501abeb8", features = ["discovery", "http"] }
anyhow = "1.0"
bytes = "1.11"
clap = { version = "4.6", features = ["derive", "env"] }
dirs = "6.0"
futures-util = "0.3"
gethostname = "1.0"
mime_guess = "2.0"
pem = "4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2.5"

# RSA key generation is bignum-heavy and very slow unoptimized.
[profile.dev.package.rsa]
opt-level = 2

[profile.dev.package.num-bigint-dig]
opt-level = 2
