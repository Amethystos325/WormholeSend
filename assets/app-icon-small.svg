<!-- Wormhole Send app icon for 16, 20 and 24 px (Windows title bars and the
     taskbar at 100%): app-icon.svg simplified to read at that size. The plate
     fills the canvas with a faint light edge, so it shows on dark
     backgrounds; the black hole is scaled up and its lines are thicker
     (ring 2.6, disk 2.3, gap 1.2). make-icons.sh puts it in app-icon.ico. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D1A2E"/>
      <stop offset="1" stop-color="#07070B"/>
    </linearGradient>
    <linearGradient id="disk" gradientUnits="userSpaceOnUse" x1="-10.6" y1="0" x2="10.6" y2="0">
      <stop offset="0" stop-color="#F2683C"/>
      <stop offset="0.55" stop-color="#FFB547"/>
      <stop offset="1" stop-color="#FFE3A3"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="23" height="23" rx="5.2" fill="url(#space)" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1"/>
  <g transform="translate(12 12) scale(0.9) rotate(-22)" fill="none" stroke-linecap="round">
    <mask id="ring-cut" maskUnits="userSpaceOnUse" x="-14" y="-14" width="28" height="28">
      <rect x="-14" y="-14" width="28" height="28" fill="white"/>
      <path d="M -10.6 0 A 10.6 4 0 0 0 10.6 0" stroke="black" stroke-width="4.7"/>
    </mask>
    <mask id="far-cut" maskUnits="userSpaceOnUse" x="-14" y="-14" width="28" height="28">
      <rect x="-14" y="-14" width="28" height="28" fill="white"/>
      <circle r="8.65" fill="black"/>
    </mask>
    <path d="M -10.6 0 A 10.6 4 0 0 1 10.6 0" stroke="url(#disk)" stroke-width="2.3" mask="url(#far-cut)"/>
    <circle r="5" stroke="#F7F3EA" stroke-width="2.6" mask="url(#ring-cut)"/>
    <path d="M -10.6 0 A 10.6 4 0 0 0 10.6 0" stroke="url(#disk)" stroke-width="2.3"/>
  </g>
</svg>
